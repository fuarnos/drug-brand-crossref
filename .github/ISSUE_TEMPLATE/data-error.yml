name: 数据错误 / Data error
description: 成分、剂量、商品名、国家归属有误，或该收录的药没收录
title: "[数据错误] "
labels: ["data-error"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢帮忙纠错。**请不要在这里贴病人的个人信息**。
        这条信息会公开可见；如果需要私下联系，写「请私下联系」即可。

  - type: input
    id: query
    attributes:
      label: 你搜的是什么
      description: 原样填搜索框里的内容，包括错别字也没关系
      placeholder: 例如 盐酸西利嗪
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: 页面地址
      description: 浏览器地址栏的完整 URL（从本站复制）
      placeholder: https://fuarnos.github.io/drug-brand-crossref/?q=...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你认为正确的是什么
      description: 成分 / 剂量 / 商品名 / 国家，任一即可
      placeholder: 应该是 盐酸西替利嗪 10 mg
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 站点现在显示的是什么
      placeholder: 显示成了 Cetirizine 0.01 g，或者完全查不到
    validations:
      required: false

  - type: input
    id: source
    attributes:
      label: 依据（可选但很有用）
      description: 说明书、药监页面、包装照片里的批准文号或链接
      placeholder: 国药准字H20041634 / 说明书链接
    validations:
      required: false

  - type: dropdown
    id: country
    attributes:
      label: 涉及哪个国家
      options:
        - 中国
        - 美国
        - 英国
        - 西班牙
        - 墨西哥
        - 澳大利亚
        - 不确定
    validations:
      required: false
